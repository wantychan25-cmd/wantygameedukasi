<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>UTS Bahasa Inggris Kelas 1 - Game Seru!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif; }
  body {
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #a1c4fd 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    padding: 30px;
    max-width: 700px;
    width: 100%;
    text-align: center;
  }
  h1 {
    color: #ff6b6b;
    font-size: 2.2em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 #ffd93d;
  }
  .subtitle { color: #555; font-size: 1.1em; margin-bottom: 20px; }
  .progress-bar {
    background: #eee;
    border-radius: 20px;
    height: 25px;
    overflow: hidden;
    margin: 15px 0;
    border: 3px solid #ffd93d;
  }
  .progress-fill {
    background: linear-gradient(90deg, #4ecdc4, #44a08d);
    height: 100%;
    width: 0%;
    transition: width 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
  }
  .info-bar {
    display: flex;
    justify-content: space-between;
    font-size: 1.1em;
    font-weight: bold;
    color: #333;
    margin-bottom: 15px;
  }
  .question {
    background: #fff9e6;
    border: 3px dashed #ff9a3c;
    border-radius: 20px;
    padding: 25px;
    margin: 20px 0;
    font-size: 1.5em;
    color: #333;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 20px 0;
  }
  .option {
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    border: 3px solid #fff;
    border-radius: 15px;
    padding: 20px;
    font-size: 1.3em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    color: #333;
    box-shadow: 0 4px 0 #888;
  }
  .option:hover { transform: translateY(-3px); box-shadow: 0 7px 0 #888; }
  .option:active { transform: translateY(2px); box-shadow: 0 2px 0 #888; }
  .option.correct { background: linear-gradient(135deg, #84fab0, #8fd3f4); animation: pulse 0.5s; }
  .option.wrong { background: linear-gradient(135deg, #ff9a9e, #fad0c4); animation: shake 0.5s; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }
  .feedback {
    font-size: 1.5em;
    font-weight: bold;
    min-height: 40px;
    margin: 10px 0;
  }
  .btn {
    background: linear-gradient(135deg, #ff9a3c, #ff6b6b);
    color: white;
    border: none;
    padding: 15px 40px;
    font-size: 1.3em;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 5px 0 #c0392b;
    transition: all 0.2s;
    margin-top: 15px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #c0392b; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c0392b; }
  .result { display: none; }
  .result h2 { color: #ff6b6b; font-size: 2.5em; margin: 20px 0; }
  .score { font-size: 3em; color: #4ecdc4; font-weight: bold; margin: 20px 0; }
  .emoji { font-size: 4em; margin: 20px 0; }
  .hidden { display: none; }
  @media (max-width: 500px) {
    .options { grid-template-columns: 1fr; }
    h1 { font-size: 1.6em; }
    .question { font-size: 1.2em; }
    .option { font-size: 1.1em; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Halaman Awal -->
  <div id="startScreen">
    <h1>🎉 UTS Bahasa Inggris 🎉</h1>
    <p class="subtitle">Kelas 1 SD - 50 Soal Pilihan Ganda</p>
    <div style="font-size:5em;">📚✨🌟</div>
    <p style="margin:20px 0; font-size:1.1em; color:#555;">
      Ayo jawab 50 soal dengan benar!<br>
      Setiap jawaban benar mendapat <b>2 poin</b> 🌟<br>
      Nilai maksimal: <b>100</b>
    </p>
    <input type="text" id="namaSiswa" placeholder="Tulis namamu di sini..." 
      style="padding:15px; font-size:1.2em; border-radius:20px; border:3px solid #ffd93d; width:80%; text-align:center; margin:15px 0;">
    <br>
    <button class="btn" onclick="mulaiGame()">🚀 MULAI BERMAIN!</button>
  </div>

  <!-- Halaman Soal -->
  <div id="gameScreen" class="hidden">
    <h1>📝 Soal <span id="nomorSoal">1</span>/50</h1>
    <div class="info-bar">
      <span>👤 <span id="namaTampil"></span></span>
      <span>⭐ Skor: <span id="skor">0</span></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill">0%</div>
    </div>
    <div class="question" id="pertanyaan">Loading...</div>
    <div class="options" id="pilihan"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- Halaman Hasil -->
  <div id="resultScreen" class="result">
    <div class="emoji" id="emojiHasil">🎊</div>
    <h2>Selesai!</h2>
    <p style="font-size:1.3em;">Selamat <b id="namaHasil"></b>!</p>
    <div class="score"><span id="nilaiAkhir">0</span></div>
    <p style="font-size:1.2em; color:#555;">Benar: <b id="benarCount">0</b> / 50</p>
    <p style="font-size:1.3em; margin:15px 0;" id="pesanHasil"></p>
    <button class="btn" onclick="location.reload()">🔄 Main Lagi</button>
  </div>
</div>

<script>
const soal = [
  {q:"1️⃣ Angka satu dalam bahasa Inggris adalah?", o:["One","Two","Three","Four"], a:0},
  {q:"2️⃣ What color is the sky? (Langit berwarna apa?)", o:["Red","Blue","Green","Yellow"], a:1},
  {q:"3️⃣ 🐱 Ini adalah...", o:["Dog","Cat","Bird","Fish"], a:1},
  {q:"4️⃣ Apple = ?", o:["Jeruk","Apel","Pisang","Mangga"], a:1},
  {q:"5️⃣ Mother = ?", o:["Ayah","Ibu","Kakak","Adik"], a:1},
  {q:"6️⃣ Good morning = ?", o:["Selamat malam","Selamat pagi","Selamat siang","Selamat sore"], a:1},
  {q:"7️⃣ How are you? = ?", o:["Siapa namamu?","Apa kabarmu?","Dari mana?","Berapa umurmu?"], a:1},
  {q:"8️⃣ 🍌 Ini buah...", o:["Apple","Banana","Orange","Grape"], a:1},
  {q:"9️⃣ Five + Three = ?", o:["Six","Seven","Eight","Nine"], a:2},
  {q:"🔟 Hand = ?", o:["Kaki","Tangan","Kepala","Mata"], a:1},
  {q:"1️⃣1️⃣ Father = ?", o:["Ibu","Paman","Ayah","Kakek"], a:2},
  {q:"1️⃣2️⃣ 🐶 Anjing dalam bahasa Inggris?", o:["Cat","Dog","Cow","Pig"], a:1},
  {q:"1️⃣3️⃣ Red = ?", o:["Biru","Merah","Kuning","Hijau"], a:1},
  {q:"1️⃣4️⃣ Ten = ?", o:["8","9","10","11"], a:2},
  {q:"1️⃣5️⃣ Eye = ?", o:["Hidung","Telinga","Mulut","Mata"], a:3},
  {q:"1️⃣6️⃣ Good night = ?", o:["Selamat pagi","Selamat malam","Selamat siang","Sampai jumpa"], a:1},
  {q:"1️⃣7️⃣ 🐘 Gajah dalam bahasa Inggris?", o:["Lion","Tiger","Elephant","Monkey"], a:2},
  {q:"1️⃣8️⃣ Sister = ?", o:["Kakak/Adik perempuan","Kakak/Adik laki-laki","Ibu","Nenek"], a:0},
  {q:"1️⃣9️⃣ Yellow = ?", o:["Ungu","Kuning","Coklat","Hitam"], a:1},
  {q:"2️⃣0️⃣ Nose = ?", o:["Hidung","Telinga","Rambut","Leher"], a:0},
  {q:"2️⃣1️⃣ 🍎 Apple berwarna?", o:["Blue","Green","Red","Black"], a:2},
  {q:"2️⃣2️⃣ Book = ?", o:["Pensil","Buku","Tas","Meja"], a:1},
  {q:"2️⃣3️⃣ What is your name? = ?", o:["Apa kabarmu?","Siapa namamu?","Dimana rumahmu?","Berapa umurmu?"], a:1},
  {q:"2️⃣4️⃣ 🐟 Ikan dalam bahasa Inggris?", o:["Fish","Bird","Duck","Hen"], a:0},
  {q:"2️⃣5️⃣ Green = ?", o:["Hijau","Biru","Putih","Abu-abu"], a:0},
  {q:"2️⃣6️⃣ Mouth = ?", o:["Mulut","Gigi","Lidah","Pipi"], a:0},
  {q:"2️⃣7️⃣ Brother = ?", o:["Kakak/Adik perempuan","Kakak/Adik laki-laki","Paman","Bibi"], a:1},
  {q:"2️⃣8️⃣ 🐒 Monyet dalam bahasa Inggris?", o:["Monkey","Rabbit","Horse","Sheep"], a:0},
  {q:"2️⃣9️⃣ Seven = ?", o:["6","7","8","9"], a:1},
  {q:"3️⃣0️⃣ Ear = ?", o:["Mata","Hidung","Telinga","Mulut"], a:2},
  {q:"3️⃣1️⃣ Thank you = ?", o:["Maaf","Tolong","Terima kasih","Sama-sama"], a:2},
  {q:"3️⃣2️⃣ 🍊 Jeruk dalam bahasa Inggris?", o:["Apple","Orange","Mango","Papaya"], a:1},
  {q:"3️⃣3️⃣ Pink = ?", o:["Merah muda","Ungu","Coklat","Hitam"], a:0},
  {q:"3️⃣4️⃣ Leg = ?", o:["Tangan","Kaki","Lengan","Punggung"], a:1},
  {q:"3️⃣5️⃣ Pencil = ?", o:["Pensil","Penggaris","Penghapus","Buku"], a:0},
  {q:"3️⃣6️⃣ 🦁 Singa dalam bahasa Inggris?", o:["Tiger","Lion","Bear","Wolf"], a:1},
  {q:"3️⃣7️⃣ Nine = ?", o:["8","9","10","11"], a:1},
  {q:"3️⃣8️⃣ Hair = ?", o:["Rambut","Kuku","Gigi","Kulit"], a:0},
  {q:"3️⃣9️⃣ Goodbye = ?", o:["Halo","Selamat pagi","Sampai jumpa","Terima kasih"], a:2},
  {q:"4️⃣0️⃣ 🐄 Sapi dalam bahasa Inggris?", o:["Goat","Cow","Horse","Sheep"], a:1},
  {q:"4️⃣1️⃣ White = ?", o:["Hitam","Putih","Abu-abu","Coklat"], a:1},
  {q:"4️⃣2️⃣ Teacher = ?", o:["Murid","Guru","Dokter","Polisi"], a:1},
  {q:"4️⃣3️⃣ 🍇 Anggur dalam bahasa Inggris?", o:["Grape","Melon","Berry","Lemon"], a:0},
  {q:"4️⃣4️⃣ Black = ?", o:["Putih","Hitam","Biru","Kuning"], a:1},
  {q:"4️⃣5️⃣ Six = ?", o:["5","6","7","8"], a:1},
  {q:"4️⃣6️⃣ 🐰 Kelinci dalam bahasa Inggris?", o:["Rabbit","Mouse","Cat","Dog"], a:0},
  {q:"4️⃣7️⃣ School = ?", o:["Rumah","Sekolah","Pasar","Taman"], a:1},
  {q:"4️⃣8️⃣ Orange (warna) = ?", o:["Oranye","Ungu","Merah","Hijau"], a:0},
  {q:"4️⃣9️⃣ I am fine = ?", o:["Saya sedih","Saya sakit","Saya baik-baik saja","Saya lapar"], a:2},
  {q:"5️⃣0️⃣ 🌟 Great job! Artinya?", o:["Kerja bagus!","Kerja buruk!","Sedih sekali!","Marah sekali!"], a:0}
];

let soalAktif = 0, skor = 0, benar = 0, nama = "";

function mulaiGame() {
  nama = document.getElementById('namaSiswa').value.trim() || "Anak Hebat";
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('namaTampil').textContent = nama;
  tampilkanSoal();
}

function tampilkanSoal() {
  if (soalAktif >= soal.length) { tampilkanHasil(); return; }
  const s = soal[soalAktif];
  document.getElementById('nomorSoal').textContent = soalAktif + 1;
  document.getElementById('pertanyaan').textContent = s.q;
  document.getElementById('feedback').textContent = "";
  const prog = ((soalAktif) / soal.length) * 100;
  document.getElementById('progressFill').style.width = prog + "%";
  document.getElementById('progressFill').textContent = Math.round(prog) + "%";
  
  const optDiv = document.getElementById('pilihan');
  optDiv.innerHTML = "";
  s.o.forEach((opsi, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opsi;
    btn.onclick = () => jawab(idx, btn);
    optDiv.appendChild(btn);
  });
}

function jawab(idx, btn) {
  const s = soal[soalAktif];
  const semuaBtn = document.querySelectorAll('.option');
  semuaBtn.forEach(b => b.onclick = null);
  
  if (idx === s.a) {
    btn.classList.add('correct');
    skor += 2;
    benar++;
    document.getElementById('feedback').textContent = "✅ BENAR! Hebat! 🌟";
    document.getElementById('feedback').style.color = "#27ae60";
  } else {
    btn.classList.add('wrong');
    semuaBtn[s.a].classList.add('correct');
    document.getElementById('feedback').textContent = "❌ Kurang tepat. Jawaban: " + s.o[s.a];
    document.getElementById('feedback').style.color = "#e74c3c";
  }
  document.getElementById('skor').textContent = skor;
  
  setTimeout(() => {
    soalAktif++;
    tampilkanSoal();
  }, 1800);
}

function tampilkanHasil() {
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('resultScreen').style.display = 'block';
  document.getElementById('namaHasil').textContent = nama;
  document.getElementById('nilaiAkhir').textContent = skor;
  document.getElementById('benarCount').textContent = benar;
  
  let emoji, pesan;
  if (skor >= 90) { emoji = "🏆🌟🎉"; pesan = "LUAR BIASA! Kamu juara! 🥇"; }
  else if (skor >= 80) { emoji = "🎊🌟"; pesan = "HEBAT SEKALI! Pertahankan ya! 👏"; }
  else if (skor >= 70) { emoji = "😊👍"; pesan = "BAGUS! Terus belajar ya!"; }
  else if (skor >= 60) { emoji = "🙂📚"; pesan = "CUKUP BAIK! Ayo belajar lagi!"; }
  else { emoji = "💪📖"; pesan = "Jangan menyerah! Ayo belajar lagi ya!"; }
  
  document.getElementById('emojiHasil').textContent = emoji;
  document.getElementById('pesanHasil').textContent = pesan;
}
</script>
</body>
</html>
